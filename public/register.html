<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Secure Auth Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-sm animate-fade-up">
    <div class="flex flex-col items-center mb-8 lock-mark group cursor-default select-none">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-3">
        <path class="lock-shackle" d="M13 18V13.5C13 9.35786 16.3579 6 20.5 6C24.6421 6 28 9.35786 28 13.5V18" stroke="#E3B341" stroke-width="2.5" stroke-linecap="round"/>
        <rect x="9" y="18" width="23" height="17" rx="3" fill="#171F2A" stroke="#E3B341" stroke-width="2"/>
        <circle cx="20.5" cy="25" r="2.4" fill="#E3B341"/>
        <rect x="19.4" y="26.5" width="2.2" height="4.5" rx="1.1" fill="#E3B341"/>
      </svg>
      <span class="font-display font-semibold text-lg tracking-tight text-[var(--text)]">Secure Auth Flow</span>
    </div>

    <div class="card rounded-2xl p-8">
      <h1 class="font-display text-xl font-semibold mb-1">Create your account</h1>
      <p class="text-sm text-[var(--muted)] mb-6">Takes less than a minute.</p>

      <div id="error-box" class="hidden mb-4 rounded-lg border border-red-900/60 bg-red-950/40 px-4 py-2.5 text-sm text-red-300"></div>

      <form id="register-form" class="space-y-4" novalidate>
        <div>
          <label for="name" class="block text-xs font-medium text-[var(--muted)] mb-1.5">Full name</label>
          <input type="text" id="name" name="name" required minlength="2" autocomplete="name"
            class="field w-full rounded-lg px-3.5 py-2.5 text-sm" placeholder="Jordan Lee" />
        </div>
        <div>
          <label for="email" class="block text-xs font-medium text-[var(--muted)] mb-1.5">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email"
            class="field w-full rounded-lg px-3.5 py-2.5 text-sm" placeholder="you@example.com" />
        </div>
        <div>
          <label for="password" class="block text-xs font-medium text-[var(--muted)] mb-1.5">Password</label>
          <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password"
            class="field w-full rounded-lg px-3.5 py-2.5 text-sm" placeholder="At least 6 characters" />
        </div>
        <div>
          <label for="confirm-password" class="block text-xs font-medium text-[var(--muted)] mb-1.5">Confirm password</label>
          <input type="password" id="confirm-password" name="confirmPassword" required minlength="6" autocomplete="new-password"
            class="field w-full rounded-lg px-3.5 py-2.5 text-sm" placeholder="Re-enter password" />
        </div>

        <button type="submit" class="btn-primary w-full rounded-lg py-2.5 text-sm font-semibold font-display mt-2">
          Create account
        </button>
      </form>

      <p class="text-sm text-[var(--muted)] text-center mt-6">
        Already have an account?
        <a href="index.html" class="link-accent font-medium">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
