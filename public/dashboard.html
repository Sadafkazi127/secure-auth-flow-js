<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Secure Auth Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-dvh">
  <header class="border-b border-[var(--border)]">
    <div class="max-w-3xl mx-auto flex items-center justify-between px-4 py-4">
      <div class="flex items-center gap-2.5 lock-mark group cursor-default select-none">
        <svg width="26" height="26" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="lock-shackle" d="M13 18V13.5C13 9.35786 16.3579 6 20.5 6C24.6421 6 28 9.35786 28 13.5V18" stroke="#E3B341" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="9" y="18" width="23" height="17" rx="3" fill="#171F2A" stroke="#E3B341" stroke-width="2"/>
          <circle cx="20.5" cy="25" r="2.4" fill="#E3B341"/>
          <rect x="19.4" y="26.5" width="2.2" height="4.5" rx="1.1" fill="#E3B341"/>
        </svg>
        <span class="font-display font-semibold text-base tracking-tight">Secure Auth Flow</span>
      </div>
      <button id="logout-btn" class="text-sm text-[var(--muted)] hover:text-[var(--text)] transition-colors font-medium">
        Sign out
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-10 space-y-6 animate-fade-up">
    <!-- Profile summary -->
    <section class="card rounded-2xl p-6 sm:p-8">
      <div class="flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-wider text-[var(--muted)] mb-1">Signed in as</p>
          <h1 id="profile-name" class="font-display text-2xl font-semibold">—</h1>
          <p id="profile-email" class="text-sm text-[var(--muted)] mt-1">—</p>
        </div>
        <div class="text-right">
          <p class="text-xs uppercase tracking-wider text-[var(--muted)] mb-1">Member since</p>
          <p id="profile-joined" class="text-sm font-mono">—</p>
        </div>
      </div>

      <div class="mt-6 pt-5 border-t border-[var(--border)]">
        <p class="text-xs uppercase tracking-wider text-[var(--muted)] mb-1.5">Active session token</p>
        <p id="token-preview" class="font-mono text-sm text-[var(--accent)] break-all">—</p>
      </div>
    </section>

    <div class="grid sm:grid-cols-2 gap-6">
      <!-- Update profile -->
      <section class="card rounded-2xl p-6 sm:p-8">
        <h2 class="font-display font-semibold text-base mb-4">Update profile</h2>
        <div id="profile-msg" class="hidden mb-3 text-sm"></div>
        <form id="profile-form" class="space-y-4" novalidate>
          <div>
            <label for="name-input" class="block text-xs font-medium text-[var(--muted)] mb-1.5">Full name</label>
            <input type="text" id="name-input" name="name" required minlength="2"
              class="field w-full rounded-lg px-3.5 py-2.5 text-sm" />
          </div>
          <button type="submit" class="btn-primary rounded-lg px-4 py-2 text-sm font-semibold font-display">
            Save changes
          </button>
        </form>
      </section>

      <!-- Change password -->
      <section class="card rounded-2xl p-6 sm:p-8">
        <h2 class="font-display font-semibold text-base mb-4">Change password</h2>
        <div id="password-msg" class="hidden mb-3 text-sm"></div>
        <form id="password-form" class="space-y-4" novalidate>
          <div>
            <label for="current-password" class="block text-xs font-medium text-[var(--muted)] mb-1.5">Current password</label>
            <input type="password" id="current-password" name="currentPassword" required
              class="field w-full rounded-lg px-3.5 py-2.5 text-sm" autocomplete="current-password" />
          </div>
          <div>
            <label for="new-password" class="block text-xs font-medium text-[var(--muted)] mb-1.5">New password</label>
            <input type="password" id="new-password" name="newPassword" required minlength="6"
              class="field w-full rounded-lg px-3.5 py-2.5 text-sm" autocomplete="new-password" />
          </div>
          <button type="submit" class="btn-primary rounded-lg px-4 py-2 text-sm font-semibold font-display">
            Update password
          </button>
        </form>
      </section>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
